 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionay App</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
            flex-direction: column;
        }
        .container{
            border: none;
            background: rgb(190, 189, 189);
            border-radius: 5px;
            height: 400px;
            width: 500px;
        }
        #input-word{
            margin-top: 10px;
            margin-left: 70px;
            padding: 10px;
            width: 280px;
            border: none;
            box-shadow: 0 1px 1px 1px gray;
            border-radius: 10px;

        }
        #search-btn{
            padding: 10px;
             border: none;
            box-shadow: 0 1px 1px 1px gray;
            border-radius: 10px;
        }
        .display-meaning{
            margin: 20px;
        }

        .title{
            margin-bottom: 20px;
        }

    </style>
</head>
<body>
    <h1 class="title">Dictionary</h1>
    <div class="container">
        
        <input type="text" placeholder="Search word" id="input-word">
        <button id="search-btn">Search</button>

        <div class="display-meaning">

        </div>
    </div>
 

    
    <script src="script.js"></script>
</body>
</html>
